<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Overlay Generator</title>
    <link rel="preload" as="font" type="font/woff2" href="fonts/InterVariable.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/roboto-v51-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/roboto-v51-latin-italic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/roboto-v51-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/oswald-v57-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/oswald-v57-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/montserrat-v31-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/montserrat-v31-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/open-sans-v44-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/lato-v25-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/jetbrains-mono-v24-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/jetbrains-mono-v24-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/poppins-v24-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/poppins-v24-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/fira-code-v27-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/fira-code-v27-latin-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/source-sans-3-v19-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/source-sans-3-v19-latin-700.woff2" crossorigin>
    <link rel="stylesheet" href="fonts/inter.css">
    <link rel="stylesheet" href="fonts/fira-code.css">
    <link rel="stylesheet" href="fonts/jetbrains-mono.css">
    <link rel="stylesheet" href="fonts/lato.css">
    <link rel="stylesheet" href="fonts/montserrat.css">
    <link rel="stylesheet" href="fonts/open-sans.css">
    <link rel="stylesheet" href="fonts/oswald.css">
    <link rel="stylesheet" href="fonts/poppins.css">
    <link rel="stylesheet" href="fonts/roboto.css">
    <link rel="stylesheet" href="fonts/source-sans-3.css">
    <link rel="stylesheet" href="style.css?v=1"/>
</head>
<body>
    <div id="transformModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Transform Settings</h3>
                <button id="closeModal" class="close-btn">x</button>
            </div>
            <div id="cropInfo" class="crop-info">
                <span id="cropHorizontal" class="crop-label">Left: 0 Right: 0</span>
                <span id="cropVertical" class="crop-label">Top: 0 Bottom: 0</span>
            </div>
        </div>
    </div>
    <div class="layout">
        <aside class="overlay-settings" aria-label="Controls">
            <h2>Overlay Generator</h2>
            <div class="setting-list">
                <div class="setting">
                    <label for="canvasWidth">OBS canvas width</label>
                    <input type="number" id="canvasWidth" value="1920" min="1" />
                </div>

                <div class="setting">
                    <label for="canvasHeight">OBS canvas height</label>
                    <input type="number" id="canvasHeight" value="1080" min="1" />
                </div>

                <div class="setting">
                    <label for="color1">Primary color</label>
                    <div class="color-input">
                        <input type="text" id="color1Text" class="hex" placeholder="#RRGGBB"/>
                        <input type="color" id="color1" value="#ffb0c5" />
                    </div>
                </div>

                <div class="setting">
                    <label for="color2">Secondary color</label>
                    <div class="color-input">
                        <input type="text" id="color2Text" class="hex" placeholder="#RRGGBB"/>
                        <input type="color" id="color2" value="#99cdf0" />
                    </div>
                </div>

                <div class="setting">
                    <label for="colorText">Text color</label>
                    <div class="color-input">
                        <input type="text" id="textColorHexInput" class="hex" placeholder="#RRGGBB"/>
                        <input type="color" id="colorText" value="#000000" />
                    </div>
                </div>

                <div class="setting">
                    <label for="pixelCount">Number of pixels</label>
                    <div class="slider-row">
                        <input type="range" id="pixelCount" value="9" min="1" max="50" aria-label="Number of pixels"/>
                        <div class="slider-value" id="pixelCountValue">9</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="pixelHeight">Pixel height</label>
                    <div class="slider-row">
                        <input type="range" id="pixelHeight" value="8" min="1" max="50" aria-label="Pixel height"/>
                        <div class="slider-value" id="pixelHeightValue">8</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="opacityPixels">Opacity (square)</label>
                    <div class="slider-row">
                        <input type="range" id="opacityPixels" value="100" min="0" max="100" aria-label="Opacity pixels"/>
                        <div class="slider-value" id="opacityPixelsValue">100</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="opacityText">Opacity (text)</label>
                    <div class="slider-row">
                        <input type="range" id="opacityText" value="100" min="0" max="100" aria-label="Opacity text"/>
                        <div class="slider-value" id="opacityTextValue">100</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="textSize">Text size</label>
                    <div class="slider-row">
                        <input type="range" id="textSize" value="40" min="10" max="200" aria-label="Text size"/>
                        <div class="slider-value" id="textSizeValue">40</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="overlayWidth">Overlay width</label>
                    <div class="slider-row">
                        <input type="range" id="overlayWidth" value="60" min="10" max="60" step="10" aria-label="Overlay width"/>
                        <div class="slider-value" id="overlayWidthValue">60</div>
                    </div>
                </div>

                <div class="setting">
                    <label for="fontStyle">Font</label>
                    <select id="fontStyle">
                        <option value="Inter-400">Inter</option>
                        <option value="Inter-700">Inter Bold</option>
                        <option value="Roboto-400">Roboto</option>
                        <option value="Roboto-700">Roboto Bold</option>
                        <option value="Roboto-400i">Roboto Italic</option>
                        <option value="Oswald-400">Oswald</option>
                        <option value="Oswald-700">Oswald Bold</option>
                        <option value="Montserrat-400">Montserrat</option>
                        <option value="Montserrat-700">Montserrat Bold</option>
                        <option value="Open Sans-400">Open Sans</option>
                        <option value="Lato-400">Lato</option>
                        <option value="JetBrains Mono-400">JetBrains Mono</option>
                        <option value="JetBrains Mono-700">JetBrains Mono Bold</option>
                        <option value="Poppins-400">Poppins</option>
                        <option value="Poppins-700">Poppins Bold</option>
                        <option value="Fira Code-400">Fira Code</option>
                        <option value="Fira Code-700">Fira Code Bold</option>
                        <option value="Source Sans 3-400">Source Sans 3</option>
                        <option value="Source Sans 3-700">Source Sans 3 Bold</option>
                    </select>
                </div>

                <div class="button-row">
                    <button class="primary" id="downloadBtn" disabled>Download</button>
                    <button class="ghost" id="resetBtn" type="button">Reset</button>
                    <button class="ghost" id="toggleTransformBtn" type="button">Transform Settings</button>
                </div>
            </div>
        </aside>

        <main class="overlay-preview">
            <div class="overlay-frame">
                <canvas id="overlayCanvas" width="1920" height="1080"></canvas>
            </div>
        </main>
    </div>
    <script src="main.js?v=2"></script>
</body>
</html>
